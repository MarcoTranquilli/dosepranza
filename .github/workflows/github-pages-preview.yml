name: GitHub Pages Preview

on:
  push:
    branches:
      - feature/dosepranza-2-preview-clean
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dosepranza-pages-preview
  cancel-in-progress: true

jobs:
  build:
    name: Build static preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: bash scripts/netlify_publish_pdf.sh

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
