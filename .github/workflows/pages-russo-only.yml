name: GitHub Pages Russo-only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dosepranza-pages-russo-only
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Russo-only preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: bash scripts/netlify_publish_pdf.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run complete UAT suite
        run: |
          python3 -m http.server 8081 --directory dist > /tmp/dosepranza-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8081/ > /dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:8081 npm run test:uat

      - name: Verify Russo-only artifact
        run: |
          bash scripts/verify_russo_only.sh dist
          touch dist/.nojekyll

      - name: Publish dist to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Russo-only preview from ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
