name: GitHub Pages Preview

on:
  push:
    branches:
      - feature/dosepranza-2-preview-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dosepranza-pages-preview
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish gh-pages preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: bash scripts/netlify_publish_pdf.sh

      - name: Prepare GitHub Pages artifact
        run: |
          touch dist/.nojekyll
          cat > dist/PREVIEW.md <<'EOF'
          DOSepranza 2.0 GitHub Pages preview.
          Generated from the workflow-selected branch.
          Netlify was not used for this preview.
          EOF

      - name: Publish dist to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy DOSepranza 2.0 preview from ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
