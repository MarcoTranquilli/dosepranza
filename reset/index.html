<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset sessione DOSepranza</title>
<meta http-equiv="Cache-Control" content="no-store">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f1ea;color:#23281f}main{max-width:560px;margin:24px;padding:28px;border:1px solid #e2d8c8;border-radius:28px;background:#fff;box-shadow:0 18px 50px rgba(20,20,20,.08)}h1{margin:0 0 10px;font-size:34px;letter-spacing:-.05em}p{line-height:1.55;color:#5f6556}.status{font-weight:800;color:#315c2e}a{color:#b8683f;font-weight:900}</style>
</head>
<body>
<main>
<h1>Reset sessione</h1>
<p>Sto eliminando sessioni locali, cache e dati temporanei di DOSepranza su GitHub Pages.</p>
<p class="status" id="status">Reset in corso...</p>
<p id="done" hidden>Reset completato. <a href="../?session=clean">Torna alla home</a></p>
</main>
<script>
(async function(){
  var status=document.getElementById('status');
  var done=document.getElementById('done');
  function clearStore(s){try{var k=[];for(var i=0;i<s.length;i++)k.push(s.key(i));k.forEach(function(x){try{s.removeItem(x)}catch(e){}})}catch(e){}}
  function delDb(n){return new Promise(function(r){try{var q=indexedDB.deleteDatabase(n);q.onsuccess=r;q.onerror=r;q.onblocked=r}catch(e){r()}})}
  clearStore(localStorage); clearStore(sessionStorage);
  var jobs=[delDb('firebaseLocalStorageDb'),delDb('firebase-heartbeat-database')];
  if(window.caches&&caches.keys){jobs.push(caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k)}))}).catch(function(){}));}
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(function(){}));}
  await Promise.allSettled(jobs);
  status.textContent='Reset completato. Reindirizzamento...'; done.hidden=false;
  setTimeout(function(){location.replace('../?session=clean&v='+Date.now())},900);
})();
</script>
</body>
</html>
