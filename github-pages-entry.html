<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DOSepranza</title>
  <link rel="icon" href="./favicondosepranza.png">
</head>
<body>
  <p>Accesso a DOSepranza in corso...</p>
  <script>
    (async () => {
      const release = 'discount-included-1';
      const releaseKey = 'dose_cache_release';
      const current = new URL(window.location.href);
      const forcedReset = current.searchParams.has('swreset');
      try {
        const storedRelease = localStorage.getItem(releaseKey) || '';
        if (forcedReset || storedRelease !== release) {
          let registrations = [];
          let cacheKeys = [];
          if ('serviceWorker' in navigator) {
            registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map((key) => caches.delete(key)));
          }
          localStorage.setItem(releaseKey, release);
        }
      } catch (error) {
        // Il redirect resta disponibile anche se il browser nega la pulizia cache.
      }

      const target = new URL('./pagnottella-gourmet/', current);
      target.searchParams.set('suite', 'production');
      target.searchParams.set('v', release);
      if (current.searchParams.has('swreset')) target.searchParams.set('swreset', '1');
      window.location.replace(target.toString());
    })();
  </script>
  <noscript><a href="./pagnottella-gourmet/?suite=production">Apri DOSepranza</a></noscript>
</body>
</html>
